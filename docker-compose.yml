services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
      args:
        COMMIT_SHA: local-dev
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/reclaim
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: http://localhost:5000/api
        VITE_UPLOADS_BASE: http://localhost:5000/uploads
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data: