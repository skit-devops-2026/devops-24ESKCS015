name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — done
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: make install

    - name: Run tests
      run: make test

    - name: Build React frontend
      run: make build
  # ---------------------------------------------------------------------------
  # M4 — Containerization. Uncomment and complete when you get there.
  # The push to the registry is what proves your build actually ran, so it is
  # not optional.
  # ---------------------------------------------------------------------------

  docker:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image repo name
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}-server:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}-server:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_BASE=http://localhost:5000/api
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}-client:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}-client:latest
  # ---------------------------------------------------------------------------
  # M5 — Deployment. Add a deploy job here.
  # ---------------------------------------------------------------------------